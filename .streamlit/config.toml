[theme]
base = "dark"

primaryColor = "#5BC8DE"
backgroundColor = "#0A1319"
secondaryBackgroundColor = "#101F27"
textColor = "#E9F1F4"
linkColor = "#5BC8DE"
borderColor = "#213A46"
dataframeBorderColor = "#213A46"
dataframeHeaderBackgroundColor = "#172B35"

font = "Archivo"
headingFont = "Archivo"
codeFont = "IBM Plex Mono"
baseFontSize = 15

showWidgetBorder = true
baseRadius = "small"
buttonRadius = "small"

greenColor = "#43B888"
redColor = "#E4584C"
orangeColor = "#E3A93F"

# st.info is the "no model yet" state, shown for three subsystems out of four, so its
# colour is the instrument accent rather than an exception to the palette.
blueColor = "#5BC8DE"
blueBackgroundColor = "#123039"
blueTextColor = "#E9F1F4"

[server]
headless = true

# Streamlit re-walks sys.modules and realpaths every entry after each script run, on
# the event loop. Without watchdog it also polls those paths from four threads. A
# subsystem that imports a large dependency mid-run grows that set enough to stall the
# loop for the whole length of its model, which stops clicks being answered. Nothing
# here reloads on edit anyway: a change under src/app/ has always needed a restart.
fileWatcherType = "none"

[browser]
gatherUsageStats = false
