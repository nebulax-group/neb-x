[theme]
base = "light"

primaryColor = "#A8481C"
backgroundColor = "#F3F1EC"
secondaryBackgroundColor = "#FCFBF8"
textColor = "#14171A"
linkColor = "#8A3A16"
borderColor = "#D6D1C7"
dataframeBorderColor = "#D6D1C7"
dataframeHeaderBackgroundColor = "#EAE6DE"

font = "IBM Plex Sans"
headingFont = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
baseFontSize = 15

showWidgetBorder = true
baseRadius = "small"
buttonRadius = "small"

greenColor = "#2E6A4A"
redColor = "#9E2B20"
orangeColor = "#8A6208"

# st.info is the "no model yet" state, shown for three subsystems out of four, so its
# blue is part of the palette rather than an exception to it.
blueColor = "#2F5560"
blueBackgroundColor = "#E7ECEC"
blueTextColor = "#22414A"

[server]
headless = true

[browser]
gatherUsageStats = false
